version: '3.8'

services:
  # CLI Runner / Background Scanner
  iadcs-cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iadcs_duplicate_scanner
    volumes:
      - ./:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - QT_QPA_PLATFORM=offscreen
      - DISPLAY=${DISPLAY:-:0}
    command: ["scan", "--path", "/app/sample_apps"]

  # Automated Test Suite Container
  iadcs-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iadcs_test_runner
    environment:
      - QT_QPA_PLATFORM=offscreen
    command: ["python", "-m", "pytest", "tests/", "-v"]

  # Interactive Web Dashboard + REST API Backend Container
  iadcs-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iadcs_web_ui
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    entrypoint: ["python", "-m", "app.web_server", "8080"]

  # Standalone Compiled Binary Container (Zero Python runtime in container)
  iadcs-standalone:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    container_name: iadcs_standalone_exe
    ports:
      - "8080:8080"
